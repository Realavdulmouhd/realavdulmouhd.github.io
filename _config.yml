# ============================================================
# Feed, pagination, and archives
# ============================================================

pagination:
  enabled: false

jekyll-archives:
  posts:
    enabled: []
  books:
    enabled: []

# ============================================================
# Deployment exclusions
# ============================================================

exclude:
  - "201*"
  - "202*"
  - "*_project.md"
  - "announcement_*.md"
  - "blog.md"
  - "news.md"
  - "teaching.md"
  - "books.md"
  - "the_godfather.md"
  - "Dockerfile"
  - "docker-compose*"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "LICENSE"
  - "node_modules"
  - "vendor"
  - "docs"
  - "bin"
  - "package.json"
  - "package-lock.json"
