# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:title/

# Theme Plugins (Restores full al-folio rendering engine)
plugins:
  - al-folio-core
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-email-protect
  - jekyll-twitter-plugin
  - jekyll-3rd-party-libraries

# Scholar settings
scholar:
  last_name: Suleiman
  first_name: [Abdulrahman]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  prefix: ""

# Collections
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Exclude rogue files that were loose in root
exclude:
  - "201*"
  - "202*"
  - "*.jpg"
  - "*_project.md"
  - "announcement_*.md"
  - "blog.md"
  - "news.md"
  - "teaching.md"
  - "books.md"
  - "the_godfather.md"
  - "Dockerfile"
  - "docker-compose*"
