# ============================================================
# al-folio v1 runtime contract
# ============================================================

theme: al_folio_core

al_folio:
  api_version: 1
  style_engine: tailwind

  tailwind:
    version: "4.1.18"
    preflight: false
    css_entry: assets/tailwind/app.css

  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false

  features:
    cv:
      enabled: false
    distill:
      enabled: false

  compat:
    bootstrap:
      enabled: true
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0

  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# ============================================================
# Profile
# ============================================================

profile:
  align: right
  image: prof_pic.jpg
  image_circular: true
  more_info: >-
    <p>Software Engineer</p>
    <p>Independent Researcher</p>
    <p>AI Security &amp; Systems Architecture</p>

# ============================================================
# Social and research identifiers
# ============================================================

socials:
  email: s.abdurrahman6666@gmail.com
  github: Realavdulmouhd
  linkedin: realavdulmouhd-abdulrahman-suleiman
  orcid: 0009-0008-8213-2555
  x: real_avdulmouhd
  facebook: realavdulmouhd

# No scholar_userid is assigned until the exact Google
# Scholar author profile has been verified.
# Author discovery is linked directly from about.md.

# ============================================================
# Navigation and layout
# ============================================================

navbar_fixed: true
footer_fixed: false
max_width: 930px

search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: false

# ============================================================
# Display features
# ============================================================

enable_darkmode: true
enable_project_categories: true
enable_project_tags: true

enable_masonry: false
enable_math: true
enable_tooltips: false
enable_medium_zoom: false
enable_progressbar: false

enable_navbar_social: false
enable_publication_thumbnails: false
enable_video_embedding: false

enable_google_analytics: false
enable_cookie_consent: false
enable_google_verification: false
enable_bing_verification: false

serve_og_meta: false
serve_schema_org: false

lazy_loading_images: true
protect_email: false

repo_theme_light: default
repo_theme_dark: dark

repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: dark

# ============================================================
# Jekyll core
# ============================================================

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include:
  - _pages
  - about.md
  - projects.md
  - repositories.md

keep_files:
  - CNAME
  - .nojekyll

# ============================================================
# Collections
# ============================================================

collections:
  news:
    output: true
    permalink: /news/:path/

  projects:
    output: true
    permalink: /projects/:path/

# ============================================================
# Defaults
# ============================================================

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# ============================================================
# Jekyll plugins
# ============================================================

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

# ============================================================
# Bibliography and citations
# ============================================================

scholar:
  last_name: [Suleiman]
  first_name: [Abdulrahman, Abdurrahman]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords:
  - abbr
  - abstract
  - annotation
  - arxiv
  - bibtex_show
  - code
  - google_scholar_id
  - html
  - pdf
  - preview
  - selected
  - website

max_author_limit: 3

# ============================================================
# External links
# ============================================================

external_links:
  enabled: true
  rel: external noopener noreferrer
  target: _blank
  exclude: []

# ============================================================
# Build optimizations
# ============================================================

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude:
    - robots.txt

imagemagick:
  enabled: false

